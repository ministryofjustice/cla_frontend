# Default values for cla-frontend in a uat environment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment: "uat"
secretName: ~

envVars:
  BACKEND_BASE_URI:
    # Using service name instead of external domain name
    value: "http://cla-backend-app.laa-cla-backend-uat.svc.cluster.local"
  ENTRA_TOKEN_CACHE_KEY_PREFIX:
    value: "entra-token-uat"
  ENTRA_TOKEN_CACHE_TTL:
    value: "86400"
  ENTRA_TOKEN_EXPIRY_SAFETY_WINDOW:
    value: "300"